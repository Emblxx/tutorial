<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Tutorial</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&display=swap');

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Orbitron',sans-serif;
}

body{
  background: radial-gradient(circle at top, #111, #000);
  color:white;
}

/* TITLE */
.title{
  text-align:center;
  font-size:clamp(40px,6vw,70px);
  margin-top:30px;
  background:linear-gradient(90deg,gold,#fff3a0,gold);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}

/* VIDEO */
.video-box{
  display:flex;
  justify-content:center;
  margin-top:25px;
}

video{
  width:100%;
  max-width:900px;
  border-radius:12px;
  box-shadow:0 0 25px gold;
}

/* PROGRESS */
.progress{
  width:90%;
  max-width:900px;
  height:8px;
  background:#222;
  margin:15px auto;
  border-radius:20px;
  overflow:hidden;
}

.progress-bar{
  height:100%;
  width:0%;
  background:gold;
}

/* BUTTONS */
.center{
  text-align:center;
  margin-top:20px;
}

button{
  cursor:pointer;
}

#continueBtn{
  display:none;
  padding:14px 24px;
  border:none;
  border-radius:10px;
  background:gold;
  color:black;
}

/* SKIP */
.skipBtn{
  margin-top:10px;
  padding:10px 18px;
  border:1px solid gold;
  background:#111;
  color:gold;
  border-radius:10px;
}

/* CODE BOX */
.codeBox{
  display:none;
  text-align:center;
  margin-top:20px;
}

.codeBox input{
  padding:10px;
  border-radius:8px;
  border:1px solid gold;
  background:#111;
  color:white;
}

.codeBox button{
  margin-top:10px;
  padding:10px 15px;
  border:none;
  background:gold;
  border-radius:8px;
}

/* REWARD CODE */
.reward{
  display:none;
  text-align:center;
  margin-top:15px;
  color:gold;
  font-size:20px;
  animation:fade 1s ease-in;
}

@keyframes fade{
  from{opacity:0}
  to{opacity:1}
}

/* LINKS */
.links{
  display:none;
  text-align:center;
  margin-top:25px;
}

.links a{
  display:block;
  margin:10px auto;
  width:80%;
  max-width:500px;
  padding:12px;
  border:1px solid gold;
  color:gold;
  text-decoration:none;
  border-radius:10px;
  background:rgba(255,215,0,0.08);
}
</style>
</head>

<body>

<div class="title">TUTORIAL</div>

<div class="video-box">
  <video id="video" controls>
    <source src="video.mp4" type="video/mp4">
  </video>
</div>

<div class="progress">
  <div class="progress-bar" id="bar"></div>
</div>

<div class="center">
  <button class="skipBtn" onclick="openCode()">Skip Video</button>
</div>

<div class="center">
  <button id="continueBtn" onclick="showLinks()">Continue</button>
</div>

<div class="reward" id="reward">
  🎁 Reward Code Unlocked: <b>2030</b>
</div>

<div class="codeBox" id="codeBox">
  <p>Enter Skip Code</p>
  <input id="codeInput">
  <br>
  <button onclick="checkCode()">Unlock</button>
</div>

<div class="links" id="links">
  <a href="https://educatenow.b-cdn.net/" target="_blank">educatenow</a>
  <a href="https://cinesteam.cine-softwares.workers.dev/" target="_blank">cinesteam</a>
  <a href="https://t9math.pages.dev/class" target="_blank">t9math</a>
  <a href="https://plan-jenny-opportunities-noble.trycloudflare.com/" target="_blank">games</a>
  <a href="https://cinehub.playcode.io/" target="_blank">cinehub</a>
</div>

<script>
const video=document.getElementById("video");
const bar=document.getElementById("bar");
const btn=document.getElementById("continueBtn");
const links=document.getElementById("links");
const codeBox=document.getElementById("codeBox");
const reward=document.getElementById("reward");

let lastTime=0;

video.addEventListener("timeupdate", ()=>{
  if(!video.duration) return;

  bar.style.width = (video.currentTime/video.duration)*100 + "%";
  lastTime = video.currentTime;
});

video.addEventListener("seeking", ()=>{
  if(video.currentTime > lastTime + 2){
    video.currentTime = lastTime;
  }
});

video.addEventListener("ended", ()=>{
  btn.style.display="inline-block";
  links.style.display="block";
  codeBox.style.display="block";

  // SHOW REWARD CODE ONLY AFTER COMPLETION
  reward.style.display="block";

  window.open("https://educatenow.b-cdn.net/", "_blank");
});

function openCode(){
  codeBox.style.display="block";
}

function checkCode(){
  if(document.getElementById("codeInput").value==="2030"){
    links.style.display="block";
    btn.style.display="inline-block";
    alert("Unlocked!");
  } else {
    alert("Wrong code");
  }
}

function showLinks(){
  links.style.display="block";
}
</script>

</body>
</html>
